# Fork-only workflow (jayarjo/libmysofa), kept on the branch ci/test-refs and
# never on a branch offered upstream. A push to ci/test-refs runs libmysofa's
# own test suite on each ref listed below. It builds and tests only; it
# publishes nothing (no release, no pre-release, no artifact). The upstream
# workflow, build.yml, is disabled on this fork because its PreRelease job
# publishes a release.
name: Test the fork's refs

on:
  push:
    branches:
      - ci/test-refs

permissions:
  contents: read

jobs:
  ctest:
    name: ${{ matrix.ref }} (${{ matrix.build }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref:
          - bugfix/bounded-allocations
          - bugfix/fractalheap-zero-size
          - bugfix/refused-file-leak
          - bpad
        build:
          # The same build as upstream's Linux job.
          - plain
          # libmysofa's own ADDRESS_SANITIZE option: AddressSanitizer, which
          # on Linux also reports leaks at exit.
          - address-sanitizer
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libcunit1-dev

      - name: Check out the ref
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
          submodules: true

      - name: Show the commit under test
        run: git log -1 --format='%H %s'

      - name: Configure
        run: |
          if [ "${{ matrix.build }}" = address-sanitizer ]; then
            cmake -S . -B _build -DADDRESS_SANITIZE=ON
          else
            cmake -S . -B _build
          fi

      - name: Build
        run: cmake --build _build -j "$(nproc)"

      - name: Run tests
        if: matrix.build == 'plain'
        run: ctest --test-dir _build --output-on-failure

      # Under AddressSanitizer, every allocation over 64 MB fails and returns
      # NULL (the reader then returns MYSOFA_NO_MEMORY). A test file that
      # declares a size it cannot hold must be refused before a buffer of
      # that size is allocated, so the CUnit test, which asserts
      # MYSOFA_INVALID_FORMAT for each such file, fails if the refusal comes
      # after the allocation.
      # latTestAziBeRTA_Resamp1_Fran.sofa is a valid file of 1.4 MB with a
      # dataset of 170 MB, so its test runs without the limit.
      - name: Run tests under a 64 MB allocation limit
        if: matrix.build == 'address-sanitizer'
        env:
          ASAN_OPTIONS: max_allocation_size_mb=64:allocator_may_return_null=1
        run: ctest --test-dir _build --output-on-failure -E '^latTestAziBeRTA_Resamp1_Fran$'

      - name: Run the test of the 170 MB dataset without the limit
        if: matrix.build == 'address-sanitizer'
        run: ctest --test-dir _build --output-on-failure -R '^latTestAziBeRTA_Resamp1_Fran$'
